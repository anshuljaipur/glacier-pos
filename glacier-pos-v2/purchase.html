<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchase | Glacier ERP</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <div class="brand">GLACIER POS</div>
    <div class="nav-links">
        <a href="index.html" data-page="index.html">🛒 POS</a>
        <a href="purchase.html" data-page="purchase.html">📦 Purchase</a>
        <a href="purchase_order.html" data-page="purchase_order.html">📝 Orders</a>
        <a href="inventory.html" data-page="inventory.html">🗂 Inventory</a>
        <a href="registers.html" data-page="registers.html">📒 Registers</a>
        <a href="dashboard.html" data-page="dashboard.html">📊 Dashboard</a>
        <a href="settings.html" data-page="settings.html">⚙ Settings</a>
    </div>
    <div class="nav-right">
        <span class="user-email" id="current-user"></span>
        <button class="btn-logout" id="btn-logout">Logout</button>
    </div>
</div>

<div class="page">
    <div class="grid-2">
        <div class="card">
            <input type="text" id="posSearch" placeholder="🔍 Scan barcode or search item…">
            <div class="product-grid" id="productGrid"></div>
        </div>

        <div class="card" style="position:sticky; top:66px; height:fit-content;">
            <h3 style="margin-top:0;">Purchase Entry (Stock Inward)</h3>
            <div class="form-row">
                <input type="text" id="posSupplier" placeholder="Supplier Name">
                <input type="text" id="posRefNo" placeholder="Invoice Ref / Bill No.">
            </div>
            <div class="form-group mt-2">
                <label>Payment Mode</label>
                <select id="posPayMode">
                    <option>Account</option>
                    <option>Cash</option>
                    <option>UPI</option>
                    <option>Card</option>
                </select>
            </div>

            <div id="cartItemsBody" class="mt-2" style="min-height:100px; max-height:260px; overflow:auto;"></div>

            <div class="mt-2">
                <div class="cart-total-row"><span>Items:</span><b id="cartCount">0 Qty (0 types)</b></div>
                <div class="cart-total-row"><span>Subtotal:</span><b id="cartSubtotal">₹0.00</b></div>
                <div class="cart-total-row">
                    <span>Bill Discount:</span>
                    <span class="flex" style="gap:4px;">
                        <select id="billDiscountType" style="width:64px; padding:4px;"><option value="Amt">₹</option><option value="Perc">%</option></select>
                        <input type="number" id="billDiscountValue" value="0" style="width:80px; padding:4px;">
                    </span>
                </div>
                <div class="cart-total-row"><span>Round Off:</span><b id="cartRoundOff">0.00</b></div>
                <div class="cart-total-row grand"><span>Total:</span><span id="cartGrandTotal">₹0.00</span></div>
            </div>
            <div class="flex mt-2">
                <button class="btn btn-danger" id="btn-clear">✕ Clear</button>
                <button class="btn btn-success btn-block" id="btn-save-purchase">✔ Save Purchase & Update Stock</button>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/purchase.js"></script>
</body>
</html>
