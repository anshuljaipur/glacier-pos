<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Glacier ERP</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <div class="brand">GLACIER POS</div>
    <div class="nav-links">
        <a href="index.html" data-page="index.html">🛒 POS</a>
        <a href="purchase.html" data-page="purchase.html">📦 Purchase</a>
        <a href="purchase_order.html" data-page="purchase_order.html">📝 Orders</a>
        <a href="inventory.html" data-page="inventory.html">🗂 Inventory</a>
        <a href="registers.html" data-page="registers.html">📒 Registers</a>
        <a href="dashboard.html" data-page="dashboard.html">📊 Dashboard</a>
        <a href="settings.html" data-page="settings.html">⚙ Settings</a>
    </div>
    <div class="nav-right">
        <span class="user-email" id="current-user"></span>
        <button class="btn-logout" id="btn-logout">Logout</button>
    </div>
</div>

<div class="page">
    <div class="stat-cards">
        <div class="stat-card"><div class="label">Today's Sales</div><div class="value" id="statSales">₹0.00</div></div>
        <div class="stat-card"><div class="label">Bills Today</div><div class="value" id="statBills">0</div></div>
        <div class="stat-card"><div class="label">Returns Today</div><div class="value" id="statReturns">₹0.00</div></div>
        <div class="stat-card"><div class="label">Purchases Today</div><div class="value" id="statPurchase">₹0.00</div></div>
    </div>

    <div class="grid-2 mt-2">
        <div class="card">
            <h3>Top Selling Items Today</h3>
            <table>
                <thead><tr><th>Item</th><th>Revenue</th></tr></thead>
                <tbody id="topItemsBody"></tbody>
            </table>
        </div>
        <div class="card">
            <h3>Low / Out of Stock (<span id="lowStockCount">0</span>)</h3>
            <div class="table-wrap" style="max-height:340px;">
                <table>
                    <thead><tr><th>Item</th><th>Stock</th><th>MOQ</th></tr></thead>
                    <tbody id="lowStockBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
