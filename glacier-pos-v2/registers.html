<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registers | Glacier ERP</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <div class="brand">GLACIER POS</div>
    <div class="nav-links">
        <a href="index.html" data-page="index.html">🛒 POS</a>
        <a href="purchase.html" data-page="purchase.html">📦 Purchase</a>
        <a href="purchase_order.html" data-page="purchase_order.html">📝 Orders</a>
        <a href="inventory.html" data-page="inventory.html">🗂 Inventory</a>
        <a href="registers.html" data-page="registers.html">📒 Registers</a>
        <a href="dashboard.html" data-page="dashboard.html">📊 Dashboard</a>
        <a href="settings.html" data-page="settings.html">⚙ Settings</a>
    </div>
    <div class="nav-right">
        <span class="user-email" id="current-user"></span>
        <button class="btn-logout" id="btn-logout">Logout</button>
    </div>
</div>

<div class="page">
    <div class="card">
        <div class="flex" style="flex-wrap:wrap; gap:10px;">
            <div class="form-group" style="margin:0;"><label>From</label><input type="date" id="regFrom"></div>
            <div class="form-group" style="margin:0;"><label>To</label><input type="date" id="regTo"></div>
            <div class="form-group" style="margin:0;">
                <label>Type</label>
                <select id="regType">
                    <option value="">All Types</option>
                    <option value="Sale">Sale</option>
                    <option value="Purchase">Purchase</option>
                    <option value="Return">Return</option>
                </select>
            </div>
            <div class="form-group" style="margin:0; flex:1; min-width:160px;"><label>Search</label><input type="text" id="regSearch" placeholder="Invoice # or customer…"></div>
            <div class="form-group" style="margin:0; align-self:flex-end;">
                <button class="btn btn-warning" id="btn-refresh">↻ Refresh</button>
            </div>
            <div class="form-group" style="margin:0; align-self:flex-end;">
                <button class="btn btn-outline" id="btn-export-csv">⬇ Export CSV</button>
            </div>
        </div>
        <div class="flex-between mt-2">
            <span class="text-muted" id="regSummary">0 records</span>
        </div>
        <div class="table-wrap mt-2">
            <table>
                <thead><tr><th>Invoice</th><th>Date</th><th>Type</th><th>Customer</th><th>Mobile</th><th>Total</th><th>Actions</th></tr></thead>
                <tbody id="regBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="printArea">
    <div style="text-align:center;">
        <div style="font-weight:800; font-size:16px;" id="prFirmName"></div>
        <div id="prAddress"></div>
        <div id="prContact"></div>
        <div id="prGstinBlock" style="display:none;">GSTIN: <span id="prGstin"></span></div>
        <div style="font-weight:700; margin-top:4px;" id="prTitle"></div>
    </div>
    <hr>
    <div>Invoice#: <span id="prInv"></span></div>
    <div>Date: <span id="prDate"></span></div>
    <div>Customer: <span id="prCustomer"></span> <span id="prCustMob"></span></div>
    <div>Payment: <span id="prPayMode"></span></div>
    <hr>
    <table style="width:100%;">
        <thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amt</th></tr></thead>
        <tbody id="prItemsBody"></tbody>
    </table>
    <hr>
    <div>Subtotal: ₹<span id="prSubtotal"></span></div>
    <div>Discount: ₹<span id="prDiscount"></span></div>
    <div>Round Off: ₹<span id="prRoundoff"></span></div>
    <div style="font-weight:800; font-size:14px;">TOTAL: ₹<span id="prTotal"></span></div>
    <hr>
    <div style="text-align:center;" id="prFooter"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/registers.js"></script>
</body>
</html>
