<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Glacier ERP</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
    <div class="login-card">
        <h1>❄️ GLACIER POS</h1>
        <div class="login-error" id="loginError"></div>
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" autocomplete="username"></div>
        <div class="form-group"><label>Password</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
        <button class="btn btn-primary btn-block" id="btn-login" style="padding:12px;">Login</button>
        <p class="text-muted" style="font-size:12px; text-align:center; margin-top:14px;">
            Accounts are created by an admin in the Firebase Console → Authentication → Users. There is no self-signup.
        </p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('btn-login').addEventListener('click', attemptLogin);
document.getElementById('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });

function attemptLogin() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errBox = document.getElementById('loginError');
    const btn = document.getElementById('btn-login');
    errBox.style.display = 'none';
    if (!email || !password) {
        errBox.textContent = 'Enter both email and password.';
        errBox.style.display = 'block';
        return;
    }
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    doLogin(email, password)
        .catch(err => {
            errBox.textContent = err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found'
                ? 'Incorrect email or password.'
                : 'Login failed: ' + err.message;
            errBox.style.display = 'block';
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = 'Login';
        });
}
</script>
</body>
</html>
