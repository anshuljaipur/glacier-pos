<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retail POS Counter</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="pos-layout">

  <!-- Top Global Bar -->
  <header class="top-nav">
    <div class="brand-badge">RETAIL POS v2.6</div>
    <div class="sync-indicator" id="syncStatusBadge">
      <span class="status-dot online"></span>
      <span id="syncStatusText">ONLINE</span>
    </div>
    <div class="user-profile" id="userProfileDisplay">Cashier: Logged In</div>
  </header>

  <main class="pos-main">
    <!-- Left Column: Search & Catalog Selector -->
    <section class="catalog-pane">
      <div class="search-box-wrapper">
        <input 
          type="text" 
          id="barcodeInput" 
          placeholder="Scan barcode [F2] or search name / brand..." 
          autocomplete="off" 
          autofocus 
        />
        <button id="clearSearchBtn" class="btn-secondary">Clear</button>
      </div>

      <div class="search-results-grid" id="searchResultsContainer">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Right Column: Cart, Tenders, Calculations -->
    <section class="cart-pane">
      <div class="cart-header">
        <h2>Active Bill</h2>
        <button id="holdCartBtn" class="btn-secondary btn-sm">Hold [F8]</button>
        <button id="clearCartBtn" class="btn-danger btn-sm">Reset</button>
      </div>

      <div class="cart-table-wrapper">
        <table class="cart-table">
          <thead>
            <tr>
              <th>Item</th>
              <th width="70">Rate</th>
              <th width="100">Qty</th>
              <th width="70">Tax</th>
              <th width="80">Total</th>
              <th width="30"></th>
            </tr>
          </thead>
          <tbody id="cartTableBody">
            <!-- Items added here -->
          </tbody>
        </table>
      </div>

      <!-- Bill Totals Breakdown -->
      <div class="bill-summary">
        <div class="summary-row">
          <span>Taxable Subtotal</span>
          <span id="summaryTaxable">₹0.00</span>
        </div>
        <div class="summary-row">
          <span>GST Total</span>
          <span id="summaryGst">₹0.00</span>
        </div>
        <div class="summary-row grand-total-row">
          <span>Grand Total</span>
          <span id="summaryGrandTotal">₹0.00</span>
        </div>
      </div>

      <!-- Payment Tender Actions -->
      <div class="payment-actions">
        <button class="btn-pay btn-cash" data-mode="CASH">CASH [F9]</button>
        <button class="btn-pay btn-upi" data-mode="UPI">UPI / QR [F10]</button>
        <button class="btn-pay btn-card" data-mode="CARD">CARD [F11]</button>
        <button class="btn-pay btn-split" data-mode="SPLIT">SPLIT</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/pos-controller.js"></script>
</body>
</html>
