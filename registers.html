<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLACIER ERP - Invoice Register</title>
    <link rel="stylesheet" href="css/pos.css">
    <style>
        .register-container { padding: 20px; background: white; border-radius: 8px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); height: 100%; display: flex; flex-direction: column; overflow: hidden; width: 100%; max-width: 100%; }
        .filter-row { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; }
        .table-wrapper { flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
        .reg-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        .reg-table thead { background: var(--topbar-bg); color: white; position: sticky; top: 0; z-index: 10; }
        .reg-table th, .reg-table td { padding: 12px 15px; border-bottom: 1px solid var(--border); }
        .reg-table tbody tr:hover { background: #f8fafc; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-sale { background: #dcfce7; color: #166534; }
        .badge-purchase { background: #fee2e2; color: #991b1b; }
        .action-btn { padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; border: none; transition: 0.2s; }
        .btn-print { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .btn-print:hover { background: #2563eb; color: white; }
        .btn-del-reg { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .btn-del-reg:hover { background: #dc2626; color: white; }
        
        /* Force main content to expand fully */
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 20px; width: 100%; max-width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="app-container" style="display: flex; flex-direction: column; min-height: 100vh; width: 100%;">
        <!-- Top Navigation -->
        <header class="topbar no-print">
            <div class="topbar-brand">GLACIER ERP</div>
            <div class="topbar-actions" style="display: flex; gap: 10px;">
                <button onclick="window.location.href='index.html'" class="btn" style="background: #1f2937; border: 1px solid #374151; color: white;">🛒 POS</button>
                <button onclick="window.location.href='purchase.html'" class="btn" style="background: #1f2937; border: 1px solid #374151; color: white;">📦 Purchase</button>
                <button onclick="window.location.href='registers.html'" class="btn" style="background: #1f2937; border: 1px solid #374151; color: white;">📄 Registers</button>
                <button onclick="InventoryApp.sync()" class="btn btn-sync" id="network-status">↻ Sync Data</button>
            </div>
        </header>

        <main class="main-content no-print">
            <div class="register-container">
                
                <div class="filter-row">
                    <div class="form-group">
                        <label>Date From</label>
                        <input type="date" id="dateFrom" class="filter-input">
                    </div>
                    <div class="form-group">
                        <label>Date To</label>
                        <input type="date" id="dateTo" class="filter-input">
                    </div>
                    <div class="form-group">
                        <label>Voucher Type</label>
                        <select id="vType" class="filter-input" style="min-width: 150px;">
                            <option value="All">All Types</option>
                            <option value="Sale">Sale (Outward)</option>
                            <option value="Purchase">Purchase (Inward)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Search Invoice / Party</label>
                        <input type="text" id="regSearch" class="filter-input" placeholder="Search..." autocomplete="off">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" style="height: 34px; padding: 0 20px; font-weight: bold;" onclick="RegisterApp.filterData()">🔍 Filter</button>
                    </div>
                    <!-- NEW: Clear Filters Button -->
                    <div class="form-group">
                        <button class="btn" style="height: 34px; padding: 0 20px; font-weight: bold; background: #ef4444; color: white;" onclick="RegisterApp.clearFilters()">✖ Clear</button>
                    </div>
                    <div class="form-group">
                        <button class="btn btn-warning" id="btn-refresh" style="height: 34px; padding: 0 20px; font-weight: bold; background: #f59e0b; color: white;" onclick="RegisterApp.loadData()">↻ Refresh</button>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table class="reg-table">
                        <thead>
                            <tr>
                                <th>Invoice No.</th>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Party Name</th>
                                <th>Pay Mode</th>
                                <th style="text-align: right;">Total Amount</th>
                                <th style="text-align: center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="regBody">
                            <tr><td colspan="7" style="text-align: center; padding: 20px; color: var(--text-muted);">Loading registers...</td></tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- Thermal Receipt Modal -->
    <div id="printWrapper" class="modal-overlay" style="align-items: flex-start; overflow-y: auto; padding: 40px 0;">
        <div class="print-modal paper-80mm" id="printArea" style="margin: auto; background: white; padding-bottom: 0;">
            <div style="text-align: center; margin-bottom: 15px; padding-top: 15px;">
                <h2 id="prFirmName" style="margin: 0; font-size: 1.5em; text-transform: uppercase;">GLACIER</h2>
                <div id="prAddress" style="font-size: 0.9em; margin-top: 3px;"></div>
                <div id="prContact" style="font-size: 0.9em;"></div>
                <div id="prTitle" style="margin-top: 10px; font-weight: bold; border-top: 1px dashed black; border-bottom: 1px dashed black; padding: 5px 0;">BILL OF SUPPLY</div>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9em; padding: 0 15px;">
                <div><b>To:</b> <span id="prCustomer"></span></div>
                <div style="text-align: right;"><b>Date:</b> <span id="prDate"></span><br><b>Inv:</b> <span id="prInv"></span></div>
            </div>
            
            <div style="padding: 0 15px;">
                <table class="print-table" style="width: 100%;">
                    <thead><tr><th style="text-align:left;">Item</th><th style="text-align:center;">Qty</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Total</th></tr></thead>
                    <tbody id="prItemsBody"></tbody>
                </table>
            </div>
            
            <div style="display: flex; justify-content: space-between; font-size: 1.2em; font-weight: bold; margin-top: 5px; border-top: 1px dashed black; padding: 5px 15px 0 15px;">
                <span>Net Payable:</span>
                <span>₹<span id="prTotal"></span></span>
            </div>
            
            <div style="text-align: center; margin-top: 10px; padding-bottom: 15px; font-size: 0.9em; font-weight: bold;">Thank You! Visit Again.</div>
            
            <!-- STICKY ACTION BUTTONS -->
            <div class="no-print" style="position: sticky; bottom: 0; background: white; padding: 15px; border-top: 1px dashed #ccc; display: flex; gap: 10px; justify-content: center; box-shadow: 0 -4px 10px rgba(0,0,0,0.1);">
                <button class="btn btn-primary" style="flex: 1; padding: 12px; font-size: 16px; font-weight: bold;" onclick="window.print()">Print Now (Enter)</button>
                <button class="btn" style="flex: 1; padding: 12px; font-size: 16px; font-weight: bold; background: #ef4444; color: white;" onclick="typeof RegisterApp !== 'undefined' ? RegisterApp.closePrint() : CartApp.closePrintAndReset()">Close (Esc)</button>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        const RegisterApp = {
            allVouchers: [],
            
            init() {
                // Set default dates (1st of month to today)
                this.setInitialDates();
                
                this.loadData();
                
                // Add Enter key listener for search
                document.getElementById('regSearch').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.filterData();
                });
                
                document.addEventListener('keydown', (e) => {
                    if(e.key === 'Escape' && document.getElementById('printWrapper').classList.contains('active')) {
                        this.closePrint();
                    }
                });
            },

            setInitialDates() {
                const today = new Date();
                const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
                
                // Adjust for local timezone offsets to ensure correct YYYY-MM-DD
                const toIsoLocal = (date) => new Date(date.getTime() - (date.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                
                document.getElementById('dateTo').value = toIsoLocal(today);
                document.getElementById('dateFrom').value = toIsoLocal(firstDay);
            },

            async loadData() {
                const btn = document.getElementById('btn-refresh');
                btn.textContent = "⏳...";
                try {
                    this.allVouchers = await API.getRegisters();
                    
                    // NEW: Ensure recent transactions show on top by sorting timestamps/dates descending
                    this.allVouchers.sort((a, b) => {
                        const timeA = a.timestamp ? (a.timestamp.seconds || a.timestamp) : new Date(a.date).getTime();
                        const timeB = b.timestamp ? (b.timestamp.seconds || b.timestamp) : new Date(b.date).getTime();
                        return timeB - timeA;
                    });
                    
                    this.filterData();
                } catch (e) {
                    document.getElementById('regBody').innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Failed to load data. Ensure Code.gs is updated.</td></tr>`;
                } finally {
                    btn.textContent = "↻ Refresh";
                }
            },

            // NEW: Clear Filters Logic
            clearFilters() {
                this.setInitialDates();
                document.getElementById('vType').value = 'All';
                document.getElementById('regSearch').value = '';
                this.filterData();
            },

            filterData() {
                const dateFrom = new Date(document.getElementById('dateFrom').value);
                const dateTo = new Date(document.getElementById('dateTo').value);
                dateTo.setHours(23, 59, 59); // Include end of day
                
                const type = document.getElementById('vType').value;
                const search = document.getElementById('regSearch').value.toLowerCase().trim();
                
                const filtered = this.allVouchers.filter(v => {
                    // Handle dates formatted as DD/MM/YYYY or ISO
                    let vDate;
                    if (v.date.includes('/')) {
                        const parts = v.date.split('/');
                        vDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                    } else {
                        vDate = new Date(v.date);
                    }
                    
                    const matchDate = vDate >= dateFrom && vDate <= dateTo;
                    const matchType = type === 'All' || v.type === type;
                    const matchSearch = search === '' || 
                                      v.id.toLowerCase().includes(search) || 
                                      v.party.toLowerCase().includes(search);
                    
                    return matchDate && matchType && matchSearch;
                });

                this.renderTable(filtered);
            },

            renderTable(data) {
                const tbody = document.getElementById('regBody');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 20px; color: var(--text-muted);">No records found for this period.</td></tr>`;
                    return;
                }

                // Sorting is now handled in loadData(), so we loop normally
                data.forEach(v => {
                    const badgeClass = v.type === 'Sale' ? 'badge-sale' : 'badge-purchase';
                    const amount = parseFloat(v.total) || 0;
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: bold; color: var(--primary);">${v.id}</td>
                        <td>${v.date}</td>
                        <td><span class="badge ${badgeClass}">${v.type}</span></td>
                        <td>${v.party}</td>
                        <td>${v.mode}</td>
                        <td style="text-align: right; font-weight: bold;">₹${amount.toFixed(2)}</td>
                        <td style="text-align: center; display: flex; justify-content: center; gap: 8px;">
                            <button class="action-btn btn-print" onclick="RegisterApp.printVoucher('${v.id}')">🖨️ Print</button>
                            <button class="action-btn btn-del-reg" onclick="RegisterApp.deleteVoucher('${v.firebaseId}')">🗑️ Del</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            },

            printVoucher(id) {
                const v = this.allVouchers.find(x => x.id === id);
                if(!v) return;

                document.getElementById('prAddress').innerText = CONFIG.STORE_ADDRESS || 'A-12, Janta Store, Jaipur';
                document.getElementById('prContact').innerText = `Ph: ${CONFIG.STORE_PHONE || '9829610570'}`;
                document.getElementById('prTitle').innerText = v.type === 'Sale' ? 'TAX INVOICE' : 'PURCHASE VOUCHER';
                document.getElementById('prCustomer').innerText = v.party;
                document.getElementById('prDate').innerText = v.date;
                document.getElementById('prInv').innerText = v.id;
                
                const tbody = document.getElementById('prItemsBody');
                tbody.innerHTML = '';
                
                let items = [];
                try { items = typeof v.items === 'string' ? JSON.parse(v.items) : v.items; } catch(e) {}
                
                items.forEach(item => {
                    let itemNameHtml = `<b>${item.itemName}</b>`;
                    if(item.discount > 0) itemNameHtml += `<br><span style="font-size: 0.85em; font-style: italic;">(Disc applied)</span>`;
                    
                    tbody.innerHTML += `
                        <tr>
                            <td style="padding-bottom: 5px;">${itemNameHtml}</td>
                            <td style="text-align:center; vertical-align:top;">${item.quantity || item.qty}</td>
                            <td style="text-align:right; vertical-align:top;">${parseFloat(item.rate).toFixed(2)}</td>
                            <td style="text-align:right; vertical-align:top;">${parseFloat(item.amount).toFixed(2)}</td>
                        </tr>
                    `;
                });
                
                document.getElementById('prTotal').innerText = parseFloat(v.total).toFixed(2);
                document.getElementById('printWrapper').classList.add('active');
                
                setTimeout(() => window.print(), 300);
            },

            closePrint() {
                document.getElementById('printWrapper').classList.remove('active');
            },

           async deleteVoucher(firebaseId) {
                if(!confirm(`Are you sure you want to permanently delete this Invoice and reverse the stock?`)) return;
                
                try {
                    // Grab the full invoice data so the API knows what items to reverse
                    const voucher = this.allVouchers.find(v => v.firebaseId === firebaseId);
                    if(!voucher) return;

                    await API.deleteVoucher(voucher);
                    
                    this.allVouchers = this.allVouchers.filter(v => v.firebaseId !== firebaseId);
                    this.filterData();
                    alert("Voucher deleted and stock reversed successfully.");
                } catch(e) {
                    alert("Failed to delete voucher.");
                }
            }
        };

        window.onload = () => RegisterApp.init();
    </script>
</body>
</html>
